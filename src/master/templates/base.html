<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}{% endblock %}">
    <meta property="og:site_name" content="IW4MAdmin Master">
    <meta property="og:url" content="http://api.raidmax.org:5000">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://store.raidmax.org/static/image/brand.png">
    <meta property="og:title" content="{% block meta_title %}{% endblock %} | IW4MAdmin Master">
    <meta property="og:description" content="{{ self.meta_description() }}">

    <title>{{ self.meta_title() }} | IW4MAdmin Master</title>
    <!-- Halfmoon UI 2.0.2 -->
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Bootstrap 5 JS for navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Phosphor Icons -->
    <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
    <link rel="icon" type="image/ico" href="{{ url_for('static', filename='image/favicon.ico') }}">
</head>

<body class="dark-mode" data-bs-theme="dark">

    <div class="modal" id="serverModalCenter" tabindex="-1" role="dialog" aria-labelledby="serverModalCenterTitle"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <a href="#" class="close" role="button" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </a>
                <h5 class="modal-title" id="modalTitle"></h5>
                <div class="h5 mb-3" id="modalContent"></div>
                <div class="text-end">
                    <a href="#" class="btn btn-primary text-end" role="button">Close</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-md bg-body-tertiary sticky-top">
        <div class="container">
            <a href="/" class="navbar-brand">
                <picture>
                    <source class="img-fluid rounded" type="image/webp"
                        srcset="{{ url_for('static', filename='image/brand.webp') }}">
                    <img src="{{ url_for('static', filename='image/brand.png') }}" class="img-fluid rounded"
                        alt="IW4MAdmin" style="max-height: 40px;">
                </picture>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a href="/" class="nav-link {{ 'active' if page_id == 'graph' }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/servers" class="nav-link {{ 'active' if page_id == 'servers' }}">Servers</a>
                    </li>
                    <li class="nav-item">
                        <a href="https://github.com/RaidMax/IW4MAdmin-Master" target="_blank" class="nav-link">
                            <i class="ph ph-github-logo me-1"></i>Source
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-secondary" onclick="toggleDarkMode()" title="Toggle display mode">
                        <i class="ph ph-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
        <div class="d-flex mt-4">
            <div class="ms-auto badge text-muted">ForeverNone</div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            document.body.dataset.bsTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
        }
    </script>
    {% block additional_scripts %}{% endblock %}
</body>

</html>
