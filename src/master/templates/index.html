{% extends "base.html" %}
{% block meta_title %}Dashboard{% endblock %}
{% block meta_description %}IW4MAdmin Master Server Dashboard - instances, clients, servers, and statistics{% endblock
%}
{% block content %}
<div class="content">
    <!-- Embedded Full Grafana Dashboard (kiosk mode, excludes server list) -->
    <div id="grafana_dashboard">
        <iframe
            src="{{grafana_base_url}}/d/iw4madmin-master/iw4madmin-master-overview?orgId=1&theme=dark&from=now-24h&to=now&refresh=30s&kiosk"
            width="100%" style="height: calc(100vh - 180px); border: none; border-radius: 8px; background: #1d2125;">
        </iframe>
    </div>
</div>
{% endblock %}
