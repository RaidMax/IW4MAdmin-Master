{% for plan in plans %}
<div class="card">
    <div class="d-flex flex-row flex-md-nowrap flex-wrap">
        <div class="flex-fill">
            <div class="mb-3">
                <h3 class="card-title mb-0">{{ plan.name }}</h3>
                <div>By {{ plan.meta.author }}</div>
                <span class="text-success font-size-12 font-weight-light">{{ plan.subscription_count or '0' }}
                    subscribers</span>
            </div>

            <div class="text-muted mb-3">{{ plan.description }}</div>
            <a class="link-inverse" target="_blank" href="{{ plan.meta.help_url }}"
                title="Get more information about {{ plan.name }}">Additional Information &amp; Help</a>
        </div>

        <div class="d-flex flex-row-reverse flex-md-row align-items-center align-self-start text-nowrap mt-3 mt-md-0">
            {% if plan.price == '0.00' %}
            <div class="font-weight-bold me-md-2 ms-2">Free</div>
            {% else %}
            <div class="font-weight-bold me-md-2 ms-2">${{ plan.price }} per {{ plan.period_unit }}</div>
            {% endif %}

            <a href="javascript:void(0)" class="btn btn-primary" data-cb-type="checkout" data-cb-plan-id="{{ plan.id }}"
                title="Subscribe to {{ plan.name }}">
                <i class="ph ph-cloud-arrow-down align-middle me-1"></i>
                <span>Subscribe</span>
            </a>
        </div>
    </div>
</div>
{% endfor %}
